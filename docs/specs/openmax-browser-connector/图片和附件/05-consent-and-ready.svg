<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1831" viewBox="0 0 1800 1831"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#316DBD"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect width="1800" height="1831" fill="#FFFFFF"/><text x="46" y="57" text-anchor="start" fill="#112749" font-size="34" font-weight="700"><tspan x="46" dy="0">④ 聊天里点一次“允许”：平台确认后插件接单</tspan></text><text x="46" y="97" text-anchor="start" fill="#586982" font-size="20" font-weight="400"><tspan x="46" dy="0">网页只核对当前插件，不直接让 background 开工；不需要再打开 Popup 授权。</tspan></text><rect x="34" y="131" width="242" height="78" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="155" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="155" dy="0">cws-fe</tspan><tspan x="155" dy="25.2">聊天授权卡</tspan></text><path d="M 155 209 L 155 1706" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="406.5" y="131" width="242" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="527.5" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="527.5" dy="0">cws-core</tspan><tspan x="527.5" dy="25.2">本人 / 会话权限</tspan></text><path d="M 527.5 209 L 527.5 1706" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="779" y="131" width="242" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="900" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="900" dy="0">cws-connect</tspan><tspan x="900" dy="25.2">决定 / 状态 / outbox</tspan></text><path d="M 900 209 L 900 1706" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1151.5" y="131" width="242" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="1272.5" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1272.5" dy="0">cws-comm</tspan><tspan x="1272.5" dy="25.2">在线执行端 / 路由</tspan></text><path d="M 1272.5 209 L 1272.5 1706" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1524" y="131" width="242" height="78" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="1645" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1645" dy="0">浏览器插件</tspan><tspan x="1645" dy="25.2">当前 profile</tspan></text><path d="M 1645 209 L 1645 1706" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="40" y="228" width="1720" height="45" rx="8" fill="#EDF4FC" stroke="#D5E2F1" stroke-width="2" /><text x="60" y="258" text-anchor="start" fill="#204F89" font-size="21" font-weight="700"><tspan x="60" dy="0">A. 自动核对当前浏览器；未安装、离线或账号不一致就在卡片提示</tspan></text><rect x="755.86" y="288" width="288.28" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="900" y="309" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="900" dy="0">点击允许 → 只读核对当前插件</tspan></text><path d="M 155 322 L 1645 322" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1391.75" y="379" width="134" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1458.75" y="400" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1458.75" dy="0">已认证连接</tspan><tspan x="1458.75" dy="26.599999999999998">申请本次确认</tspan></text><path d="M 1645 439 L 1272.5 439" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1372.75" y="470" width="172" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1458.75" y="491" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1458.75" dy="0">短期当前会话确认</tspan></text><path d="M 1272.5 504 L 1645 504" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="763.08" y="561" width="273.8399999999999" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="900" y="582" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="900" dy="0">返回确认，不返回登录 token</tspan></text><path d="M 1645 595 L 155 595" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="40" y="659" width="1720" height="45" rx="8" fill="#EDF4FC" stroke="#D5E2F1" stroke-width="2" /><text x="60" y="689" text-anchor="start" fill="#204F89" font-size="21" font-weight="700"><tspan x="60" dy="0">B. 人类决定只提交给 Core → Connect</tspan></text><rect x="283.75" y="719" width="115" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="341.25" y="740" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="341.25" dy="0">批准 task</tspan><tspan x="341.25" dy="26.599999999999998">附本次确认</tspan></text><path d="M 155 779 L 527.5 779" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="665.75" y="810" width="96" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="713.75" y="831" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="713.75" dy="0">校验本人</tspan><tspan x="713.75" dy="26.599999999999998">转交决定</tspan></text><path d="M 527.5 870 L 900 870" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1009.75" y="901" width="153" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1086.25" y="922" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1086.25" dy="0">验证确认</tspan><tspan x="1086.25" dy="26.599999999999998">短期预占执行端</tspan></text><path d="M 900 961 L 1272.5 961" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1028.75" y="992" width="115" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1086.25" y="1013" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1086.25" dy="0">同一执行端</tspan><tspan x="1086.25" dy="26.599999999999998">无其他任务</tspan></text><path d="M 1272.5 1052 L 900 1052" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="752" y="1098" width="296" height="73" rx="10" fill="#F7F1FF" stroke="#AA90D1" stroke-width="2" /><text x="900" y="1122" text-anchor="middle" fill="#543C7B" font-size="18" font-weight="600"><tspan x="900" dy="0">同一事务：preparing</tspan><tspan x="900" dy="25.2">决定回执 + outbox</tspan></text><rect x="40" y="1181" width="1720" height="45" rx="8" fill="#EDF4FC" stroke="#D5E2F1" stroke-width="2" /><text x="60" y="1211" text-anchor="start" fill="#204F89" font-size="21" font-weight="700"><tspan x="60" dy="0">C. 可靠通知与 Ready；失败按任务记录对账</tspan></text><rect x="1014.69" y="1241" width="143.12" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1086.25" y="1262" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1086.25" dy="0">提交预占</tspan><tspan x="1086.25" dy="26.599999999999998">投递 prepare</tspan></text><path d="M 900 1301 L 1272.5 1301" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1382.25" y="1267" width="153" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1458.75" y="1288" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1458.75" dy="0">仅通知该执行端</tspan></text><path d="M 1272.5 1301 L 1645 1301" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1447" y="1347" width="296" height="48" rx="10" fill="#F7F1FF" stroke="#AA90D1" stroke-width="2" /><text x="1595" y="1371" text-anchor="middle" fill="#543C7B" font-size="18" font-weight="600"><tspan x="1595" dy="0">保存任务上下文；此时仍不建页</tspan></text><rect x="1365.91" y="1423" width="185.67999999999995" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1458.75" y="1444" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1458.75" dy="0">Ready + 应用 ACK</tspan></text><path d="M 1645 1457 L 1272.5 1457" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="1009.75" y="1423" width="153" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1086.25" y="1444" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1086.25" dy="0">核验目标／版本</tspan></text><path d="M 1272.5 1457 L 900 1457" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="752" y="1529" width="296" height="48" rx="10" fill="#F7F1FF" stroke="#AA90D1" stroke-width="2" /><text x="900" y="1553" text-anchor="middle" fill="#543C7B" font-size="18" font-weight="600"><tspan x="900" dy="0">running；发布激活事件</tspan></text><rect x="50" y="1608" width="1700" height="54" rx="9" fill="#FFF6E5" stroke="#E1C58D" stroke-width="2" /><text x="900" y="1642" text-anchor="middle" fill="#805C20" font-size="19" font-weight="500"><tspan x="900" dy="0">激活：Connect → Comm → zylos-openmax → C4 / SQLite → Agent；状态同时更新聊天卡片。</tspan></text><rect x="35" y="1740" width="1730" height="64" rx="12" fill="#F2F6FC" stroke="#D8E3F0" stroke-width="2" /><text x="900" y="1780" text-anchor="middle" fill="#25446F" font-size="20" font-weight="600"><tspan x="900" dy="0">短期确认是后台安全参数，不是新配对码。首条具体网址到达，才创建工作页。</tspan></text></g></svg>