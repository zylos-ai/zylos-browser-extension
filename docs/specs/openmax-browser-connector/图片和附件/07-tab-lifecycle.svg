<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1610" viewBox="0 0 1680 1610"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#316DBD"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect width="1680" height="1610" fill="#FFFFFF"/><text x="46" y="57" text-anchor="start" fill="#112749" font-size="34" font-weight="700"><tspan x="46" dy="0">⑥ 浏览器里会发生什么：你的页面不动</tspan></text><text x="46" y="97" text-anchor="start" fill="#586982" font-size="20" font-weight="400"><tspan x="46" dy="0">示意中的颜色仅用于区分状态；任务结束不保留“已完成／已停止”分组。</tspan></text><text x="49" y="150" text-anchor="start" fill="#153C70" font-size="25" font-weight="700"><tspan x="49" dy="0">1. 已登录／尚未执行</tspan></text><rect x="44" y="171" width="1592" height="165" rx="14" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2" /><rect x="45" y="172" width="1590" height="77" rx="13" fill="#F0F3F8" stroke="none" stroke-width="2" /><circle cx="69" cy="194" r="6" fill="#E99692"/><circle cx="91" cy="194" r="6" fill="#E5CB85"/><circle cx="113" cy="194" r="6" fill="#91C6AC"/><rect x="143" y="188" width="185" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="156" y="216" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="156" dy="0">我的邮箱</tspan></text><text x="310" y="216" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="310" dy="0">×</tspan></text><rect x="337" y="188" width="190" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="350" y="216" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="350" dy="0">OpenMAX 对话</tspan></text><text x="509" y="216" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="509" dy="0">×</tspan></text><text x="72" y="289" text-anchor="start" fill="#41607E" font-size="22" font-weight="400"><tspan x="72" dy="0">没有工作标签，没有调试；插件只在后台在线。</tspan></text><text x="49" y="411" text-anchor="start" fill="#153C70" font-size="25" font-weight="700"><tspan x="49" dy="0">2. 点击允许后，首条网址到达 → 开始工作</tspan></text><rect x="44" y="432" width="1592" height="165" rx="14" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2" /><rect x="45" y="433" width="1590" height="77" rx="13" fill="#F0F3F8" stroke="none" stroke-width="2" /><circle cx="69" cy="455" r="6" fill="#E99692"/><circle cx="91" cy="455" r="6" fill="#E5CB85"/><circle cx="113" cy="455" r="6" fill="#91C6AC"/><rect x="143" y="449" width="185" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="156" y="477" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="156" dy="0">我的邮箱</tspan></text><text x="310" y="477" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="310" dy="0">×</tspan></text><rect x="337" y="449" width="190" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="350" y="477" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="350" dy="0">OpenMAX 对话</tspan></text><text x="509" y="477" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="509" dy="0">×</tspan></text><rect x="558" y="442" width="671" height="58" rx="10" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><rect x="566" y="451" width="204" height="39" rx="7" fill="#14845D" stroke="none" stroke-width="2" /><text x="668" y="477" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600"><tspan x="668" dy="0">Agent · 工作中</tspan></text><rect x="782" y="450" width="207" height="43" rx="9" fill="#EAF8F0" stroke="#C5CFDD" stroke-width="2" /><text x="795" y="478" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="795" dy="0">搜索页</tspan></text><text x="971" y="478" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="971" dy="0">×</tspan></text><rect x="1000" y="450" width="207" height="43" rx="9" fill="#EAF8F0" stroke="#C5CFDD" stroke-width="2" /><text x="1013" y="478" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="1013" dy="0">详情页</tspan></text><text x="1189" y="478" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="1189" dy="0">×</tspan></text><text x="72" y="550" text-anchor="start" fill="#41607E" font-size="22" font-weight="400"><tspan x="72" dy="0">只操作彩色组中的任务页面；你切去邮箱，不会改变 Agent 的目标。</tspan></text><text x="49" y="672" text-anchor="start" fill="#153C70" font-size="25" font-weight="700"><tspan x="49" dy="0">3. 如果需要你登录 → 暂停</tspan></text><rect x="44" y="693" width="1592" height="165" rx="14" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2" /><rect x="45" y="694" width="1590" height="77" rx="13" fill="#F0F3F8" stroke="none" stroke-width="2" /><circle cx="69" cy="716" r="6" fill="#E99692"/><circle cx="91" cy="716" r="6" fill="#E5CB85"/><circle cx="113" cy="716" r="6" fill="#91C6AC"/><rect x="143" y="710" width="185" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="156" y="738" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="156" dy="0">我的邮箱</tspan></text><text x="310" y="738" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="310" dy="0">×</tspan></text><rect x="337" y="710" width="190" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="350" y="738" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="350" dy="0">OpenMAX 对话</tspan></text><text x="509" y="738" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="509" dy="0">×</tspan></text><rect x="558" y="703" width="453" height="58" rx="10" fill="#FFF4D9" stroke="#B57A0C" stroke-width="2" /><rect x="566" y="712" width="204" height="39" rx="7" fill="#B57A0C" stroke="none" stroke-width="2" /><text x="668" y="738" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600"><tspan x="668" dy="0">等待继续</tspan></text><rect x="782" y="711" width="207" height="43" rx="9" fill="#FFF4D9" stroke="#C5CFDD" stroke-width="2" /><text x="795" y="739" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="795" dy="0">登录页</tspan></text><text x="971" y="739" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="971" dy="0">×</tspan></text><text x="72" y="811" text-anchor="start" fill="#41607E" font-size="22" font-weight="400"><tspan x="72" dy="0">解除调试和光标；你处理完后，在 OpenMAX 对话里点“继续”。</tspan></text><text x="49" y="933" text-anchor="start" fill="#153C70" font-size="25" font-weight="700"><tspan x="49" dy="0">4A. 结束／停止 → 清理临时页</tspan></text><rect x="44" y="954" width="1592" height="165" rx="14" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2" /><rect x="45" y="955" width="1590" height="77" rx="13" fill="#F0F3F8" stroke="none" stroke-width="2" /><circle cx="69" cy="977" r="6" fill="#E99692"/><circle cx="91" cy="977" r="6" fill="#E5CB85"/><circle cx="113" cy="977" r="6" fill="#91C6AC"/><rect x="143" y="971" width="185" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="156" y="999" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="156" dy="0">我的邮箱</tspan></text><text x="310" y="999" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="310" dy="0">×</tspan></text><rect x="337" y="971" width="190" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="350" y="999" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="350" dy="0">OpenMAX 对话</tspan></text><text x="509" y="999" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="509" dy="0">×</tspan></text><text x="72" y="1072" text-anchor="start" fill="#41607E" font-size="22" font-weight="400"><tspan x="72" dy="0">任务临时页关闭，空组消失；你原来的页面保留。</tspan></text><text x="49" y="1194" text-anchor="start" fill="#153C70" font-size="25" font-weight="700"><tspan x="49" dy="0">4B. 如果明确要求保留结果 → 交还普通标签</tspan></text><rect x="44" y="1215" width="1592" height="165" rx="14" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2" /><rect x="45" y="1216" width="1590" height="77" rx="13" fill="#F0F3F8" stroke="none" stroke-width="2" /><circle cx="69" cy="1238" r="6" fill="#E99692"/><circle cx="91" cy="1238" r="6" fill="#E5CB85"/><circle cx="113" cy="1238" r="6" fill="#91C6AC"/><rect x="143" y="1232" width="185" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="156" y="1260" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="156" dy="0">我的邮箱</tspan></text><text x="310" y="1260" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="310" dy="0">×</tspan></text><rect x="337" y="1232" width="190" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="350" y="1260" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="350" dy="0">OpenMAX 对话</tspan></text><text x="509" y="1260" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="509" dy="0">×</tspan></text><rect x="558" y="1232" width="207" height="43" rx="9" fill="#FFFFFF" stroke="#C5CFDD" stroke-width="2" /><text x="571" y="1260" text-anchor="start" fill="#33445C" font-size="17" font-weight="400"><tspan x="571" dy="0">结果页</tspan></text><text x="747" y="1260" text-anchor="middle" fill="#8694A6" font-size="18" font-weight="400"><tspan x="747" dy="0">×</tspan></text><text x="72" y="1333" text-anchor="start" fill="#41607E" font-size="22" font-weight="400"><tspan x="72" dy="0">结果页退出 Agent 分组，不再受控；临时页照常清理。</tspan></text><rect x="35" y="1500" width="1610" height="64" rx="12" fill="#F2F6FC" stroke="#D8E3F0" stroke-width="2" /><text x="840" y="1540" text-anchor="middle" fill="#25446F" font-size="20" font-weight="600"><tspan x="840" dy="0">不确定归属的页面不强删；等待超时也要收尾。任务记录保留在聊天里，不靠标签组留历史。</tspan></text></g></svg>