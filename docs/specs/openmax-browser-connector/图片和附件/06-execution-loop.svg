<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1681" viewBox="0 0 1800 1681"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#316DBD"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect width="1800" height="1681" fill="#FFFFFF"/><text x="46" y="57" text-anchor="start" fill="#112749" font-size="34" font-weight="700"><tspan x="46" dy="0">⑤ 执行不是一串预写动作，而是持续观察与决策</tspan></text><text x="46" y="97" text-anchor="start" fill="#586982" font-size="20" font-weight="400"><tspan x="46" dy="0">仅画工具主链；任务授权由 Connect 管，点击与截图不绕普通聊天队列。</tspan></text><rect x="34" y="131" width="242" height="78" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="155" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="155" dy="0">zylos-core</tspan><tspan x="155" dy="25.2">Agent 决策</tspan></text><path d="M 155 209 L 155 1556" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="406.5" y="131" width="242" height="78" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="527.5" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="527.5" dy="0">Browser Channel</tspan><tspan x="527.5" dy="25.2">CLI + agent-browser</tspan></text><path d="M 527.5 209 L 527.5 1556" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="779" y="131" width="242" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="900" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="900" dy="0">cws-comm</tspan><tspan x="900" dy="25.2">任务定向中转</tspan></text><path d="M 900 209 L 900 1556" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1151.5" y="131" width="242" height="78" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="1272.5" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1272.5" dy="0">浏览器插件</tspan><tspan x="1272.5" dy="25.2">chrome.debugger</tspan></text><path d="M 1272.5 209 L 1272.5 1556" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1524" y="131" width="242" height="78" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="1645" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1645" dy="0">Chrome</tspan><tspan x="1645" dy="25.2">本任务工作标签</tspan></text><path d="M 1645 209 L 1645 1556" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="40" y="228" width="1720" height="45" rx="8" fill="#EDF4FC" stroke="#D5E2F1" stroke-width="2" /><text x="60" y="258" text-anchor="start" fill="#204F89" font-size="21" font-weight="700"><tspan x="60" dy="0">A. 首次打开具体网址（此前没有 about:blank 工作页）</tspan></text><rect x="271.97" y="288" width="138.56" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="341.25" y="309" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="341.25" dy="0">打开具体 URL</tspan></text><path d="M 155 322 L 527.5 322" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="646.75" y="288" width="134" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="713.75" y="309" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="713.75" dy="0">任务建页命令</tspan></text><path d="M 527.5 322 L 900 322" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1038.25" y="288" width="96" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1086.25" y="309" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1086.25" dy="0">定向投递</tspan></text><path d="M 900 322 L 1272.5 322" fill="none" stroke="#316DBD" stroke-width="2.5"  marke