<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1448" viewBox="0 0 1840 1448"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#316DBD"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect width="1840" height="1448" fill="#FFFFFF"/><text x="46" y="57" text-anchor="start" fill="#112749" font-size="34" font-weight="700"><tspan x="46" dy="0">② Connector 开通：把 Browser 能力装到 Agent</tspan></text><text x="46" y="97" text-anchor="start" fill="#586982" font-size="20" font-weight="400"><tspan x="46" dy="0">沿用实际 Channel 命令路径；不需要把某个浏览器绑定给 Agent。</tspan></text><rect x="41.5" y="131" width="227" height="78" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="155" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="155" dy="0">cws-fe</tspan><tspan x="155" dy="25.2">应用连接</tspan></text><path d="M 155 209 L 155 1323" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="296.5" y="131" width="227" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="410" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="410" dy="0">cws-core</tspan><tspan x="410" dy="25.2">Agent 管理权限</tspan></text><path d="M 410 209 L 410 1323" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="551.5" y="131" width="227" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="665" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="665" dy="0">cws-connect</tspan><tspan x="665" dy="25.2">能力状态</tspan></text><path d="M 665 209 L 665 1323" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="806.5" y="131" width="227" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="920" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="920" dy="0">cws-comm</tspan><tspan x="920" dy="25.2">控制帧</tspan></text><path d="M 920 209 L 920 1323" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1061.5" y="131" width="227" height="78" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="1175" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1175" dy="0">zylos-openmax</tspan><tspan x="1175" dy="25.2">确定性安装器</tspan></text><path d="M 1175 209 L 1175 1323" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1316.5" y="131" width="227" height="78" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="1430" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1430" dy="0">zylos-core</tspan><tspan x="1430" dy="25.2">组件管理</tspan></text><path d="M 1430 209 L 1430 1323" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1571.5" y="131" width="227" height="78" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="1685" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1685" dy="0">Browser Channel</tspan><tspan x="1685" dy="25.2">工具服务</tspan></text><path d="M 1685 209 L 1685 1323" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="221.57999999999998" y="221" width="121.84" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="282.5" y="242" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="282.5" dy="0">选择 Agent</tspan><tspan x="282.5" dy="26.599999999999998">点击连接</tspan></text><path d="M 155 281 L 410 281" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="480" y="312" width="115" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="537.5" y="333" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="537.5" dy="0">验证管理权</tspan><tspan x="537.5" dy="26.599999999999998">请求开通</tspan></text><path d="M 410 372 L 665 372" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="517" y="418" width="296" height="48" rx="10" fill="#F7F1FF" stroke="#AA90D1" stroke-width="2" /><text x="665" y="442" text-anchor="middle" fill="#543C7B" font-size="18" font-weight="600"><tspan x="665" dy="0">保存“开通中”及 request ID</tspan></text><rect x="702.7" y="494" width="179.59999999999997" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="792.5" y="515" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="792.5" dy="0">channel.connect</tspan><tspan x="792.5" dy="26.599999999999998">browser 类型</tspan></text><path d="M 665 554 L 920 554" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="967.58" y="585" width="159.84" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1047.5" y="606" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1047.5" dy="0">Agent 已有连接</tspan><tspan x="1047.5" dy="26.599999999999998">投递控制命令</tspan></text><path d="M 920 645 L 1175 645" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1226" y="676" width="153" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1302.5" y="697" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1302.5" dy="0">受控安装／启用</tspan></text><path d="M 1175 710 L 1430 710" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1490.5" y="767" width="134" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1557.5" y="788" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1557.5" dy="0">启动固定组件</tspan></text><path d="M 1430 801 L 1685 801" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1322.72" y="858" width="214.56" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1430" y="879" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1430" dy="0">检查 CLI／服务／版本</tspan></text><path d="M 1175 892 L 1685 892" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1363" y="949" width="134" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1430" y="970" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1430" dy="0">健康检查结果</tspan></text><path d="M 1685 983 L 1175 983" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="652.16" y="1040" width="280.68" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="792.5" y="1061" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="792.5" dy="0">按 request ID 回报安装结果</tspan></text><path d="M 1175 1074 L 410 1074" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="461" y="1131" width="153" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="537.5" y="1152" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="537.5" dy="0">保存成功／失败</tspan></text><path d="M 410 1165 L 665 1165" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="50" y="1225" width="1740" height="54" rx="9" fill="#FFF6E5" stroke="#E1C58D" stroke-width="2" /><text x="920" y="1259" text-anchor="middle" fill="#805C20" font-size="19" font-weight="500"><tspan x="920" dy="0">cws-fe 经 Core 查询 Connect 的最新状态；只有成功回执才显示“已开通”。</tspan></text><rect x="35" y="1357" width="1770" height="64" rx="12" fill="#F2F6FC" stroke="#D8E3F0" stroke-width="2" /><text x="920" y="1397" text-anchor="middle" fill="#25446F" font-size="20" font-weight="600"><tspan x="920" dy="0">Browser Channel = zylos-browser-channel；本流程不开网页，也不授予任何任务操作权。</tspan></text></g></svg>