pan x="60" dy="0">循环：直到任务完成，或需要用户处理</tspan></text><rect x="293.25" y="536" width="96" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="341.25" y="557" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="341.25" dy="0">观察页面</tspan></text><path d="M 155 570 L 527.5 570" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="634.97" y="536" width="157.56" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="713.75" y="557" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="713.75" dy="0">CDP 读取／截图</tspan></text><path d="M 527.5 570 L 900 570" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1038.25" y="536" width="96" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1086.25" y="557" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1086.25" dy="0">转发命令</tspan></text><path d="M 900 570 L 1272.5 570" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1391.75" y="536" width="134" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1458.75" y="557" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1458.75" dy="0">读取本任务页</tspan></text><path d="M 1272.5 570 L 1645 570" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1410.75" y="627" width="96" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1458.75" y="648" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1458.75" dy="0">页面状态</tspan></text><path d="M 1645 661 L 1272.5 661" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="1028.75" y="627" width="115" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1086.25" y="648" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1086.25" dy="0">状态／截图</tspan></text><path d="M 1272.5 661 L 900 661" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="665.75" y="627" width="96" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="713.75" y="648" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="713.75" dy="0">原路返回</tspan></text><path d="M 900 661 L 527.5 661" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="264.75" y="627" width="153" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="341.25" y="648" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="341.25" dy="0">供模型实际查看</tspan></text><path d="M 527.5 661 L 155 661" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="57" y="733" width="296" height="48" rx="10" fill="#F7F1FF" stroke="#AA90D1" stroke-width="2" /><text x="205" y="757" text-anchor="middle" fill="#543C7B" font-size="18" font-weight="600"><tspan x="205" dy="0">根据本次观察决定下一步</tspan></text><rect x="274.25" y="809" width="134" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="341.25" y="830" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="341.25" dy="0">选择下一动作</tspan></text><path d="M 155 843 L 527.5 843" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="634.97" y="809" width="157.56" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="713.75" y="830" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="713.75" dy="0">CDP 点击／输入</tspan></text><path d="M 527.5 843 L 900 843" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1019.25" y="809" width="134" height="26" rx="4" fill="#FFFFFF" stroke="none" strok