934 L 155 934" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="38" y="476" width="1724" height="549" rx="14" fill="none" stroke="#168D70" stroke-width="2" stroke-dasharray="9 5"/><text x="1740" y="1012" text-anchor="end" fill="#117A60" font-size="19" font-weight="600"><tspan x="1740" dy="0">↺ 结果重新进入下一次决策</tspan></text><rect x="50" y="1049" width="1700" height="54" rx="9" fill="#FFF6E5" stroke="#E1C58D" stroke-width="2" /><text x="900" y="1083" text-anchor="middle" fill="#805C20" font-size="19" font-weight="500"><tspan x="900" dy="0">需要登录：Connect 置 waiting_user，插件解除调试并保留页；在对话明确继续后，回到上方循环。</tspan></text><rect x="40" y="1133" width="1720" height="45" rx="8" fill="#EDF4FC" stroke="#D5E2F1" stroke-width="2" /><text x="60" y="1163" text-anchor="start" fill="#204F89" font-size="21" font-weight="700"><tspan x="60" dy="0">B. 任务完成／停止时：收尾后再给最终答案</tspan></text><rect x="50" y="1196" width="1700" height="54" rx="9" fill="#FFF6E5" stroke="#E1C58D" stroke-width="2" /><text x="900" y="1230" text-anchor="middle" fill="#805C20" font-size="19" font-weight="500"><tspan x="900" dy="0">Channel → OpenMAX broker → cws-core → cws-connect：进入 finalizing，禁止新的普通操作。</tspan></text><rect x="665.75" y="1273" width="96" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="713.75" y="1294" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="713.75" dy="0">任务清理</tspan></text><path d="M 527.5 1307 L 900 1307" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1028.75" y="1273" width="115" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1086.25" y="1294" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1086.25" dy="0">仅允许收尾</tspan></text><path d="M 900 1307 L 1272.5 1307" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1382.25" y="1273" width="153" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1458.75" y="1294" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1458.75" dy="0">关临时页／解绑</tspan></text><path d="M 1272.5 1307 L 1645 1307" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1410.75" y="1364" width="96" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1458.75" y="1385" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1458.75" dy="0">清理结果</tspan></text><path d="M 1645 1398 L 1272.5 1398" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="1038.25" y="1364" width="96" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1086.25" y="1385" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1086.25" dy="0">应用回执</tspan></text><path d="M 1272.5 1398 L 900 1398" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="665.75" y="1364" width="96" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="713.75" y="1385" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="713.75" dy="0">收尾结果</tspan></text><path d="M 900 1398 L 527.5 1398" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="283.75" y="1364" width="115" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="341.25" y="1385" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="341.25" dy="0">确认后回复</tspan></text><path d="M 527.5 1398 L 155 1398" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="50" y="1458" width="1700" height="54" rx="9" fill="#FFF6E5" stroke="#E1C58D" stroke-width="2" /><text x="900" y="1492" text-anchor="middle" fill="#805C20" font-size="19" font-weight="500"><tspan x="900" dy="0">清理结果同步 Connect；最终文字：Agent → C4 → OpenMAX → cws-core → cws-comm → cws-fe。</tspan></text><rect x="35" y="1590" width="1730" height="64" rx="12" fill="#F2F6FC" stroke="#D8E3F0" stroke-width="2" /><text x="900" y="1630" text-anchor="middle" fill="#25446F" font-size="20" font-weight="600"><tspan x="900" dy="0">Browser Channel = zylos-browser-channel；需要登录则暂停，不能把“等待用户”当成最终完成。</tspan></text></g></svg>