<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1210" viewBox="0 0 1880 1210"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#316DBD"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect width="1880" height="1210" fill="#FFFFFF"/><text x="46" y="57" text-anchor="start" fill="#112749" font-size="34" font-weight="700"><tspan x="46" dy="0">Browser Use · 具体服务如何协作</tspan></text><text x="46" y="97" text-anchor="start" fill="#586982" font-size="20" font-weight="400"><tspan x="46" dy="0">目标方案 v3.0｜插件按用户登录；Agent 按能力开通；控制权按本次任务批准</tspan></text><rect x="28" y="144" width="1824" height="206" rx="14" fill="#F9FBFE" stroke="#C6D7ED" stroke-width="2" /><text x="48" y="179" text-anchor="start" fill="#153C70" font-size="25" font-weight="700"><tspan x="48" dy="0">① 插件登录和在线：没有 Agent 绑定</tspan></text><rect x="48" y="220" width="184" height="67" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="140" y="247.04" text-anchor="middle" fill="#172F51" font-size="17" font-weight="600"><tspan x="140" dy="0">浏览器插件</tspan><tspan x="140" dy="23.799999999999997">同一用户会话</tspan></text><rect x="353" y="220" width="272" height="67" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="489" y="246.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="489" dy="0">Logto</tspan><tspan x="489" dy="25.2">统一登录</tspan></text><path d="M 232 255 L 353 255" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="293" y="242" text-anchor="middle" fill="#426386" font-size="17" font-weight="400"><tspan x="293" dy="0">登录</tspan></text><rect x="647" y="220" width="184" height="67" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="739" y="247.04" text-anchor="middle" fill="#172F51" font-size="17" font-weight="600"><tspan x="739" dy="0">浏览器插件</tspan><tspan x="739" dy="23.799999999999997">同一用户会话</tspan></text><rect x="952" y="220" width="272" height="67" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="1088" y="246.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1088" dy="0">cws-core</tspan><tspan x="1088" dy="25.2">身份／WS 票据</tspan></text><path d="M 831 255 L 952 255" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="892" y="242" text-anchor="middle" fill="#426386" font-size="17" font-weight="400"><tspan x="892" dy="0">取票据</tspan></text><rect x="1246" y="220" width="184" height="67" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="1338" y="247.04" text-anchor="middle" fill="#172F51" font-size="17" font-weight="600"><tspan x="1338" dy="0">浏览器插件</tspan><tspan x="1338" dy="23.799999999999997">同一用户会话</tspan></text><rect x="1551" y="220" width="272" height="67" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="1687" y="246.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1687" dy="0">cws-comm</tspan><tspan x="1687" dy="25.2">Browser 执行端</tspan></text><path d="M 1430 255 L 1551 255" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1491" y="242" text-anchor="middle" fill="#426386" font-size="17" font-weight="400"><tspan x="1491" dy="0">出站 WSS</tspan></text><text x="50" y="325" text-anchor="start" fill="#48617F" font-size="19" font-weight="400"><tspan x="50" dy="0">同一个插件分别调用三个服务。Comm 还会向 Core 验证票据；登录不授予网页控制权。</tspan></text><rect x="28" y="367" width="1824" height="206" rx="14" fill="#F9FBFE" stroke="#C6D7ED" stroke-width="2" /><text x="48" y="402" text-anchor="start" fill="#153C70" font-size="25" font-weight="700"><tspan x="48" dy="0">② 应用连接开通：安装／启用 Agent 的 Browser Channel</tspan></text><rect x="48" y="433" width="218" height="77" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="157" y="465.42" text-anchor="middle" fill="#172F51" font-size="16" font-weight="600"><tspan x="157" dy="0">应用连接</tspan><tspan x="157" dy="22.4">cws-fe</tspan></text><path d="M 266 478 L 309 478" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="287.5" y="428" text-anchor="middle" fill="#426386" font-size="15" font-weight="400"><tspan x="287.5" dy="0">选 Agent</tspan></text><rect x="309" y="433" width="218" height="77" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="418" y="465.42" text-anchor="middle" fill="#172F51" font-size="16" font-weight="600"><tspan x="418" dy="0">权限入口</tspan><tspan x="418" dy="22.4">cws-core</tspan></text><path d="M 527 478 L 570 478" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="548.5" y="428" text-anchor="middle" fill="#426386" font-size="15" font-weight="400"><tspan x="548.5" dy="0">校验权限</tspan></text><rect x="570" y="433" width="218" height="77" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="679" y="465.42" text-anchor="middle" fill="#172F51" font-size="16" font-weight="600"><tspan x="679" dy="0">开通业务</tspan><tspan x="679" dy="22.4">cws-connect</tspan></text><path d="M 788 478 L 831 478" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="809.5" y="428" text-anchor="middle" fill="#426386" font-size="15" font-weight="400"><tspan x="809.5" dy="0">安装命令</tspan></text><rect x="831" y="433" width="218" height="77" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="940" y="465.42" text-anchor="middle" fill="#172F51" font-size="16" font-weight="600"><tspan x="940" dy="0">控制帧投递</tspan><tspan x="940" dy="22.4">cws-comm</tspan></text><path d="M 1049 478 L 1092 478" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1070.5" y="428" text-anchor="middle" fill="#426386" font-size="15" font-weight="400"><tspan x="1070.5" dy="0">定向下发</tspan></text><rect x="1092" y="433" width="218" height="77" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="1201" y="465.42" text-anchor="middle" fill="#172F51" font-size="16" font-weight="600"><tspan x="1201" dy="0">安装适配器</tspan><tspan x="1201" dy="22.4">zylos-openmax</tspan></text><path d="M 1310 478 L 1353 478" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1331.5" y="428" text-anchor="middle" fill="#426386" font-size="15" font-weight="400"><tspan x="1331.5" dy="0">安装／启用</tspan></text><rect x="1353" y="433" width="218" height="77" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="1462" y="465.42" text-anchor="middle" fill="#172F51" font-size="16" font-weight="600"><tspan x="1462" dy="0">组件管理</tspan><tspan x="1462" dy="22.4">zylos-core</tspan></text><path d="M 1571 478 L 1614 478" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1592.5" y="428" text-anchor="middle" fill="#426386" font-size="15" font-weight="400"><tspan x="1592.5" dy="0">启动／核验</tspan></text><rect x="1614" y="433" width="218" height="77" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="1723" y="465.42" text-anchor="middle" fill="#172F51" font-size="16" font-weight="600"><tspan x="1723" dy="0">Browser 工具</tspan><tspan x="1723" dy="22.4">zylos-browser-channel</tspan></text><text x="50" y="548" text-anchor="start" fill="#48617F" font-size="19" font-weight="400"><tspan x="50" dy="0">安装结果：zylos-openmax → cws-core → cws-connect；收到健康回执才显示“已开通”。</tspan></text><rect x="28" y="590" width="1824" height="206" rx="14" fill="#F9FBFE" stroke="#C6D7ED" stroke-width="2" /><text x="48" y="625" text-anchor="start" fill="#153C70" font-size="25" font-weight="700"><tspan x="48" dy="0">③ 私聊和任务授权：聊天走 Comm，授权真值在 Connect</tspan></text><rect x="48" y="656" width="266" height="77" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="181" y="687.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="181" dy="0">私聊／授权卡</tspan><tspan x="181" dy="25.2">cws-fe</tspan></text><path d="M 314 701 L 427.5 701" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="370.75" y="651" text-anchor="middle" fill="#426386" font-size="18" font-weight="400"><tspan x="370.75" dy="0">发消息</tspan></text><rect x="427.5" y="656" width="266" height="77" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="560.5" y="687.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="560.5" dy="0">身份与会话权限</tspan><tspan x="560.5" dy="25.2">cws-core</tspan></text><path d="M 693.5 701 L 807 701" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="750.25" y="651" text-anchor="middle" fill="#426386" font-size="18" font-weight="400"><tspan x="750.25" dy="0">普通聊天</tspan></text><rect x="807" y="656" width="266" height="77" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="940" y="687.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="940" dy="0">消息传输</tspan><tspan x="940" dy="25.2">cws-comm</tspan></text><path d="M 1073 701 L 1186.5 701" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1129.75" y="651" text-anchor="middle" fill="#426386" font-size="18" font-weight="400"><tspan x="1129.75" dy="0">Agent 消息</tspan></text><rect x="1186.5" y="656" width="266" height="77" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="1319.5" y="687.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1319.5" dy="0">C4 收发适配</tspan><tspan x="1319.5" dy="25.2">zylos-openmax</tspan></text><path d="M 1452.5 701 L 1566 701" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1509.25" y="651" text-anchor="middle" fill="#426386" font-size="18" font-weight="400"><tspan x="1509.25" dy="0">投递／回复</tspan></text><rect x="1566" y="656" width="266" height="77" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="1699" y="687.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1699" dy="0">C4 / SQLite / Agent</tspan><tspan x="1699" dy="25.2">zylos-core</tspan></text><text x="50" y="771" text-anchor="start" fill="#48617F" font-size="19" font-weight="400"><tspan x="50" dy="0">任务申请经 OpenMAX broker → cws-core → cws-connect；人类决定经 cws-fe → cws-core → cws-connect。</tspan></text><rect x="28" y="813" width="1824" height="206" rx="14" fill="#F9FBFE" stroke="#C6D7ED" stroke-width="2" /><text x="48" y="848" text-anchor="start" fill="#153C70" font-size="25" font-weight="700"><tspan x="48" dy="0">④ 执行循环：不经过普通聊天队列</tspan></text><rect x="48" y="879" width="266" height="77" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="181" y="910.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="181" dy="0">Agent 决策</tspan><tspan x="181" dy="25.2">zylos-core</tspan></text><path d="M 314 924 L 427.5 924" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="370.75" y="874" text-anchor="middle" fill="#426386" font-size="18" font-weight="400"><tspan x="370.75" dy="0">调用工具</tspan></text><rect x="427.5" y="879" width="266" height="77" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="560.5" y="910.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="560.5" dy="0">CLI + agent-browser</tspan><tspan x="560.5" dy="25.2">zylos-browser-channel</tspan></text><path d="M 693.5 924 L 807 924" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="750.25" y="874" text-anchor="middle" fill="#426386" font-size="18" font-weight="400"><tspan x="750.25" dy="0">WSS 执行帧</tspan></text><rect x="807" y="879" width="266" height="77" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="940" y="910.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="940" dy="0">任务定向中转</tspan><tspan x="940" dy="25.2">cws-comm</tspan></text><path d="M 1073 924 L 1186.5 924" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1129.75" y="874" text-anchor="middle" fill="#426386" font-size="18" font-weight="400"><tspan x="1129.75" dy="0">WSS 执行帧</tspan></text><rect x="1186.5" y="879" width="266" height="77" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="1319.5" y="910.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1319.5" dy="0">浏览器插件</tspan><tspan x="1319.5" dy="25.2">zylos-browser-extension</tspan></text><path d="M 1452.5 924 L 1566 924" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1509.25" y="874" text-anchor="middle" fill="#426386" font-size="18" font-weight="400"><tspan x="1509.25" dy="0">chrome.debugger</tspan></text><rect x="1566" y="879" width="266" height="77" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="1699" y="910.66" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1699" dy="0">本任务工作标签</tspan><tspan x="1699" dy="25.2">Chrome</tspan></text><text x="50" y="994" text-anchor="start" fill="#48617F" font-size="19" font-weight="400"><tspan x="50" dy="0">命令向右、结果向左。Channel 与插件都主动连 Comm；Agent 不需要公网入站地址。</tspan></text><text x="49" y="1062" text-anchor="start" fill="#345370" font-size="20" font-weight="600"><tspan x="49" dy="0">绿色：用户电脑　　蓝色：平台服务　　紫色：Agent 所在机器（可只有内网地址）</tspan></text><rect x="35" y="1093" width="1810" height="64" rx="12" fill="#F2F6FC" stroke="#D8E3F0" stroke-width="2" /><text x="940" y="1133" text-anchor="middle" fill="#25446F" font-size="20" font-weight="600"><tspan x="940" dy="0">cws-comm 是通信服务；Common 是共享代码／协议。cws-agent-manager 不在本次安装和执行主链上。</tspan></text></g></svg>