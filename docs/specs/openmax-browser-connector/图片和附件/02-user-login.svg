<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1491" viewBox="0 0 1660 1491"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#316DBD"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect width="1660" height="1491" fill="#FFFFFF"/><text x="46" y="57" text-anchor="start" fill="#112749" font-size="34" font-weight="700"><tspan x="46" dy="0">① 插件登录：只登记用户在线，不绑定 Agent</tspan></text><text x="46" y="97" text-anchor="start" fill="#586982" font-size="20" font-weight="400"><tspan x="46" dy="0">同一 OpenMAX 账号体系；插件拥有自己的登录会话。以下 Browser 入口为目标扩展。</tspan></text><rect x="34" y="131" width="242" height="78" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="155" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="155" dy="0">浏览器插件</tspan><tspan x="155" dy="25.2">用户电脑</tspan></text><path d="M 155 209 L 155 1366" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="484" y="131" width="242" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="605" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="605" dy="0">Logto</tspan><tspan x="605" dy="25.2">统一登录</tspan></text><path d="M 605 209 L 605 1366" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="934" y="131" width="242" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="1055" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1055" dy="0">cws-core</tspan><tspan x="1055" dy="25.2">身份 / 票据</tspan></text><path d="M 1055 209 L 1055 1366" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1384" y="131" width="242" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="1505" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1505" dy="0">cws-comm</tspan><tspan x="1505" dy="25.2">Browser 执行端</tspan></text><path d="M 1505 209 L 1505 1366" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="40" y="228" width="1580" height="45" rx="8" fill="#EDF4FC" stroke="#D5E2F1" stroke-width="2" /><text x="60" y="258" text-anchor="start" fill="#204F89" font-size="21" font-weight="700"><tspan x="60" dy="0">A. 用户登录（已有 SSO 会话可复用，无须重复输入密码）</tspan></text><rect x="303.5" y="288" width="153" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="380" y="309" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="380" dy="0">公开客户端登录</tspan><tspan x="380" dy="26.599999999999998">授权码 + PKCE</tspan></text><path d="M 155 348 L 605 348" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="294" y="379" width="172" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="380" y="400" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="380" dy="0">返回插件用户会话</tspan></text><path d="M 605 413 L 155 413" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="491.26" y="470" width="227.48000000000002" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="605" y="491" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="605" dy="0">onboard／识别平台用户</tspan></text><path d="M 155 504 L 1055 504" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="509.12" y="561" width="191.75999999999993" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="605" y="582" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="605" dy="0">确认平台 identity</tspan></text><path d="M 1055 595 L 155 595" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="40" y="659" width="1580" height="45" rx="8" fill="#EDF4FC" stroke="#D5E2F1" stroke-width="2" /><text x="60" y="689" text-anchor="start" fill="#204F89" font-size="21" font-weight="700"><tspan x="60" dy="0">B. 插件后台连接 Comm</tspan></text><rect x="468.84000000000003" y="719" width="272.31999999999994" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="605" y="740" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="605" dy="0">申请 Browser 用途 WS 票据</tspan></text><path d="M 155 753 L 1055 753" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="538" y="810" width="134" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="605" y="831" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="605" dy="0">短期建连票据</tspan></text><path d="M 1055 844 L 155 844" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="736.4" y="901" width="187.2" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="830" y="922" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="830" dy="0">主动建立 WSS 连接</tspan></text><path d="M 155 935 L 1505 935" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1184.5" y="992" width="191" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1280" y="1013" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1280" dy="0">消费票据／验证用途</tspan></text><path d="M 1505 1026 L 1055 1026" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1213" y="1083" width="134" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1280" y="1104" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1280" dy="0">确认用户身份</tspan></text><path d="M 1055 1117 L 1505 1117" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="677.8800000000001" y="1174" width="304.23999999999984" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="830" y="1195" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="830" dy="0">执行端在线：endpoint + epoch</tspan></text><path d="M 1505 1208 L 155 1208" fill="none" stroke="#6382A9" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="50" y="1268" width="1560" height="54" rx="9" fill="#FFF6E5" stroke="#E1C58D" stroke-width="2" /><text x="830" y="1302" text-anchor="middle" fill="#805C20" font-size="19" font-weight="500"><tspan x="830" dy="0">后台心跳与重连；没有任务时，不创建标签、不附加调试、不读取网页。</tspan></text><rect x="35" y="1400" width="1590" height="64" rx="12" fill="#F2F6FC" stroke="#D8E3F0" stroke-width="2" /><text x="830" y="1440" text-anchor="middle" fill="#25446F" font-size="20" font-weight="600"><tspan x="830" dy="0">登录回答“你是谁”；不是回答“哪个 Agent 可以控制浏览器”。</tspan></text></g></svg>