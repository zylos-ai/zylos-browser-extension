<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1467" viewBox="0 0 1840 1467"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#316DBD"/></marker></defs><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><rect width="1840" height="1467" fill="#FFFFFF"/><text x="46" y="57" text-anchor="start" fill="#112749" font-size="34" font-weight="700"><tspan x="46" dy="0">③ 提出浏览器需求：显示卡片，同时预连接</tspan></text><text x="46" y="97" text-anchor="start" fill="#586982" font-size="20" font-weight="400"><tspan x="46" dy="0">普通聊天负责把需求送到 Agent；cws-connect 保存待授权任务。</tspan></text><rect x="41.5" y="131" width="227" height="78" rx="14" fill="#EAF8F0" stroke="#14845D" stroke-width="2" /><text x="155" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="155" dy="0">cws-fe</tspan><tspan x="155" dy="25.2">私聊界面</tspan></text><path d="M 155 209 L 155 1342" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="296.5" y="131" width="227" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="410" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="410" dy="0">cws-core</tspan><tspan x="410" dy="25.2">可信业务入口</tspan></text><path d="M 410 209 L 410 1342" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="551.5" y="131" width="227" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="665" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="665" dy="0">cws-comm</tspan><tspan x="665" dy="25.2">聊天 / 任务通知</tspan></text><path d="M 665 209 L 665 1342" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="806.5" y="131" width="227" height="78" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="920" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="920" dy="0">zylos-openmax</tspan><tspan x="920" dy="25.2">C4 / 来源 broker</tspan></text><path d="M 920 209 L 920 1342" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1061.5" y="131" width="227" height="78" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="1175" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1175" dy="0">zylos-core</tspan><tspan x="1175" dy="25.2">C4 / SQLite / Agent</tspan></text><path d="M 1175 209 L 1175 1342" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1316.5" y="131" width="227" height="78" rx="14" fill="#F2ECFF" stroke="#7250AC" stroke-width="2" /><text x="1430" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1430" dy="0">Browser Channel</tspan><tspan x="1430" dy="25.2">CLI / 预连接</tspan></text><path d="M 1430 209 L 1430 1342" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="1571.5" y="131" width="227" height="78" rx="14" fill="#EAF2FF" stroke="#2461BC" stroke-width="2" /><text x="1685" y="163.16" text-anchor="middle" fill="#172F51" font-size="18" font-weight="600"><tspan x="1685" dy="0">cws-connect</tspan><tspan x="1685" dy="25.2">任务授权真值</tspan></text><path d="M 1685 209 L 1685 1342" fill="none" stroke="#CBD6E4" stroke-width="2.5" stroke-dasharray="8 6" /><rect x="40" y="228" width="1760" height="45" rx="8" fill="#EDF4FC" stroke="#D5E2F1" stroke-width="2" /><text x="60" y="258" text-anchor="start" fill="#204F89" font-size="21" font-weight="700"><tspan x="60" dy="0">A. “帮我打开 1688，搜索儿童玩具”</tspan></text><rect x="234.5" y="288" width="96" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="282.5" y="309" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="282.5" dy="0">发送私聊</tspan></text><path d="M 155 322 L 410 322" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="480" y="288" width="115" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="537.5" y="309" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="537.5" dy="0">保存／投递</tspan></text><path d="M 410 322 L 665 322" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="731.58" y="288" width="121.84" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="792.5" y="309" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="792.5" dy="0">Agent 消息</tspan></text><path d="M 665 322 L 920 322" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1002.54" y="288" width="89.92" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1047.5" y="309" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1047.5" dy="0">进入 C4</tspan></text><path d="M 920 322 L 1175 322" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1230.94" y="379" width="143.12" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1302.5" y="400" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1302.5" dy="0">需要 Browser</tspan><tspan x="1302.5" dy="26.599999999999998">调用申请工具</tspan></text><path d="M 1175 439 L 1430 439" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="40" y="477" width="1760" height="45" rx="8" fill="#EDF4FC" stroke="#D5E2F1" stroke-width="2" /><text x="60" y="507" text-anchor="start" fill="#204F89" font-size="21" font-weight="700"><tspan x="60" dy="0">B. 创建待授权任务；不信任模型自填用户身份</tspan></text><rect x="999.7" y="537" width="350.5999999999999" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1175" y="558" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1175" dy="0">私有 broker：携带真实消息 context</tspan></text><path d="M 1430 571 L 920 571" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="503.76" y="628" width="322.48" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="665" y="649" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="665" dy="0">以 Agent 身份申请，携带来源句柄</tspan></text><path d="M 920 662 L 410 662" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="863.08" y="719" width="368.8399999999999" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1047.5" y="740" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1047.5" dy="0">验证本人／会话／Agent 能力，创建任务</tspan></text><path d="M 410 753 L 1685 753" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1487" y="825" width="296" height="73" rx="10" fill="#F7F1FF" stroke="#AA90D1" stroke-width="2" /><text x="1635" y="849" text-anchor="middle" fill="#543C7B" font-size="18" font-weight="600"><tspan x="1635" dy="0">awaiting_consent</tspan><tspan x="1635" dy="25.2">暂不指定浏览器</tspan></text><rect x="1079.5" y="901" width="191" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1175" y="922" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1175" dy="0">可靠事件：授权卡片</tspan></text><path d="M 1685 935 L 665 935" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="295.5" y="992" width="229" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="410" y="1013" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="410" dy="0">原用户／原会话显示卡片</tspan></text><path d="M 665 1026 L 155 1026" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="40" y="1090" width="1760" height="45" rx="8" fill="#EDF4FC" stroke="#D5E2F1" stroke-width="2" /><text x="60" y="1120" text-anchor="start" fill="#204F89" font-size="21" font-weight="700"><tspan x="60" dy="0">C. 等待用户时建立中转连接，减少点允许后的等待</tspan></text><rect x="857.38" y="1150" width="380.23999999999995" height="26" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1047.5" y="1171" text-anchor="middle" fill="#253F63" font-size="19" font-weight="500"><tspan x="1047.5" dy="0">经 Core / Connect 核验的任务级预连接</tspan></text><path d="M 1430 1184 L 665 1184" fill="none" stroke="#316DBD" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="50" y="1244" width="1740" height="54" rx="9" fill="#FFF6E5" stroke="#E1C58D" stroke-width="2" /><text x="920" y="1278" text-anchor="middle" fill="#805C20" font-size="19" font-weight="500"><tspan x="920" dy="0">预连接只有心跳与状态权限；不能发送 CDP、获取截图或创建工作标签。</tspan></text><rect x="35" y="1376" width="1770" height="64" rx="12" fill="#F2F6FC" stroke="#D8E3F0" stroke-width="2" /><text x="920" y="1416" text-anchor="middle" fill="#25446F" font-size="20" font-weight="600"><tspan x="920" dy="0">Browser Channel = zylos-browser-channel；卡片不代表已授权，模型文本不能替代人类批准。</tspan></text></g></svg>